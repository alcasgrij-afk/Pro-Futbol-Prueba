name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: profutbol
          POSTGRES_PASSWORD: profutbol_test
          POSTGRES_DB: profutbol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profutbol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://profutbol:profutbol_test@localhost:5432/profutbol_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build shared-types
        run: npm run build -w packages/shared-types

      - name: Generar cliente de Prisma
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Tests unitarios (con cobertura)
        run: npm run test:cov -w apps/api

      - name: Aplicar migraciones (schema de prueba)
        run: npm run prisma:deploy -w apps/api

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web

  # Se activa recien cuando el merge llega a main; construye y publica la
  # imagen Docker de la API. El despliegue real a staging/produccion (paso
  # final del flujo de CI/CD, ver Plan Tecnico seccion 7) se agrega cuando
  # el equipo defina el proveedor de hosting definitivo.
  build-imagen-docker:
    needs: lint-test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen Docker de la API
        run: docker build -f apps/api/Dockerfile -t profutbol-api:${{ github.sha }} .
