version: "3.9"

# Stack de referencia para produccion (Fase 1, Sprint 4). En la practica,
# el equipo puede preferir usar DigitalOcean App Platform / AWS ECS con
# bases de datos administradas en vez de correr Postgres/Redis en
# contenedores propios (ver Plan Tecnico, seccion 3.6). Este archivo sirve
# como referencia minima funcional y como base para un droplet unico.

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - apps/api/.env
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
